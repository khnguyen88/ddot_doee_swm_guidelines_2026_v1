<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWM Education — DOEE / EISA 438 Walkthrough</title>
  <style>
:root {
  --bg: #0B1220;
  --panel: #121B2B;
  --panel-alt: #16202F;
  --border: #26374D;
  --text: #E7EEF6;
  --muted: #8FA3BF;
  --accent: #38C6B4;
  --accent-soft: rgba(56, 198, 180, 0.12);
  --fail: #E5484D;
  --warn: #E5B94D;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.45;
}

.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 20px 14px; overflow-y: auto; }
.main { padding: 24px 32px; overflow-y: auto; }
.empty-state { color: var(--muted); font-size: 15px; text-align: center; margin-top: 20vh; }
.dropzone { display: block; margin-top: 20px; padding: 40px; border: 2px dashed var(--border); border-radius: 8px; cursor: pointer; }
.dropzone:hover { border-color: var(--accent); }

/* ── Calc sheet (shared by preview and print) ────────────────────────────── */
.calc-sheet {
  background: #fff; color: #111820;
  border-radius: 8px; padding: 22px 24px;
  font-size: 12.5px; max-width: 7.5in; margin: 0 auto 20px;
}
.cs-header { border-bottom: 2px solid #111820; padding-bottom: 10px; margin-bottom: 16px; }
.cs-title { font-size: 17px; font-weight: 800; color: #0B1220; }
.cs-sub { font-size: 12px; color: #4B5A6E; margin-top: 2px; }
.cs-block { margin-bottom: 16px; }
.cs-block-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  color: #2A9D8F; margin-bottom: 7px; padding-bottom: 4px; border-bottom: 1px solid #DCE4EC;
}
table.cs-kv { border-collapse: collapse; width: 100%; }
table.cs-kv td { padding: 4px 8px 4px 0; font-size: 12.5px; vertical-align: top; }
table.cs-kv td.cs-k { color: #4B5A6E; width: 56%; }
table.cs-kv td.cs-v { font-family: var(--font-mono); font-weight: 600; color: #0B1220; }
.cs-formula-block { margin: 6px 0; }
.cs-formula-line { font-family: var(--font-mono); font-size: 12.5px; color: #1B2740; padding: 2px 0; }
.cs-result {
  margin-top: 8px; padding: 8px 12px; background: #EFFAF7; border: 1px solid #BEE9E0;
  border-radius: 6px; font-size: 13px; color: #0B1220;
}
.cs-result b { font-family: var(--font-mono); color: #0F766E; font-size: 14px; }
.cs-result-fail { background: #FFF1F2; border-color: #FECACA; }
.cs-result-fail b { color: #B91C1C; }
.cs-note { font-size: 11.5px; color: #5D7291; font-style: italic; margin: 4px 0; }
.cs-warn {
  font-size: 12px; color: #8A4B00; background: #FFF4E0; border: 1px solid #F3D28C;
  border-radius: 6px; padding: 7px 10px; margin: 6px 0;
}
.cs-footer { margin-top: 18px; padding-top: 10px; border-top: 1px solid #DCE4EC; font-size: 10.5px; color: #8A97A8; }

table.data { border-collapse: collapse; width: 100%; font-size: 10.5px; }
table.data th, table.data td { padding: 4px 6px; border-bottom: 1px solid #DCE4EC; text-align: left; }
table.data th { background: #F3F6F9; color: #0B1220; font-weight: 700; }

/* ── Print rules ─────────────────────────────────────────────────────────── */
#printArea { display: none; background: #fff; }
body.print-mode .app { display: none; }
body.print-mode #printArea { display: block; }
body.print-mode #printArea .calc-sheet {
  border-radius: 0; padding: 0.4in;
  min-height: 9.5in; max-height: 10in; overflow: hidden;
  page-break-after: always; break-after: page;
  margin: 0 auto;
}
body.print-mode #printArea .calc-sheet:last-child { page-break-after: auto; }

@page { size: letter portrait; margin: 0.5in; }
@page landscape-page { size: letter landscape; margin: 0.5in; }
.calc-sheet.landscape { page: landscape-page; }

@media print {
  .app { display: none !important; }
  #printArea { display: block !important; }
  #printArea .calc-sheet { page-break-after: always; break-after: page; min-height: 9.5in; }
  #printArea .calc-sheet:last-child { page-break-after: auto; }
}

/* ── Sidebar nav ─────────────────────────────────────────────────────────── */
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
.nav-btn {
  all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px; color: var(--muted);
  font-size: 13px; border: 1px solid transparent;
}
.nav-btn:hover { background: var(--panel-alt); color: var(--text); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(56, 198, 180, 0.35); }
.nav-num { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); width: 18px; }

/* ── Topbar ─────────────────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.topbar .filename { color: var(--muted); font-size: 13px; }
.topbar .clear-btn {
  all: unset; cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 4px;
}
.topbar .clear-btn:hover { color: var(--text); }
.topbar .spacer { flex: 1; }
.topbar .btn {
  all: unset; cursor: pointer; padding: 6px 12px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); font-size: 13px;
  border: 1px solid rgba(56, 198, 180, 0.35);
}
.topbar .btn:hover { background: rgba(56, 198, 180, 0.2); }

/* ── Banners ────────────────────────────────────────────────────────────── */
.banner { padding: 10px 14px; margin: 10px 20px; border-radius: 6px; font-size: 13px; }
.banner.error { background: rgba(229, 72, 77, 0.1); border: 1px solid var(--fail); color: #FCA5A5; }
.banner.warn  { background: rgba(229, 185, 77, 0.1); border: 1px solid var(--warn); color: #FDE68A; }

/* ── Education-specific additions ──────────────────────────────────────────── */
.cs-edu-overview {
  background: #EFF6FF; border: 1px solid #BFDBFE; border-left: 4px solid #3B82F6;
  padding: 10px 14px; margin-bottom: 14px; border-radius: 4px;
  font-size: 12.5px; color: #1E3A8A;
}
.cs-edu-overview .cs-edu-overview-label {
  display: block; font-weight: 700; font-size: 10.5px; letter-spacing: 0.6px;
  text-transform: uppercase; margin-bottom: 4px; color: #1D4ED8;
}
.cs-edu-why {
  background: #FFFBEB; border: 1px solid #FDE68A; padding: 10px 14px;
  margin-bottom: 14px; border-radius: 4px; font-size: 12px; color: #713F12;
}
.cs-edu-why .cs-edu-why-label {
  display: block; font-weight: 700; font-size: 10.5px; letter-spacing: 0.6px;
  text-transform: uppercase; margin-bottom: 4px; color: #92400E;
}
.cs-edu-formula {
  background: #F8FAFC; border: 1px solid #CBD5E1; padding: 10px 14px;
  margin-bottom: 14px; border-radius: 4px; font-size: 12.5px; color: #0F172A;
}
.cs-edu-formula .cs-edu-formula-label {
  display: block; font-weight: 700; font-size: 10.5px; letter-spacing: 0.6px;
  text-transform: uppercase; margin-bottom: 6px; color: #334155;
}
.cs-edu-worked {
  background: #F0FDF4; border: 1px solid #BBF7D0; border-left: 4px solid #16A34A;
  padding: 10px 14px; margin-bottom: 14px; border-radius: 4px;
  font-size: 12.5px; color: #14532D;
}
.cs-edu-worked .cs-edu-worked-label {
  display: block; font-weight: 700; font-size: 10.5px; letter-spacing: 0.6px;
  text-transform: uppercase; margin-bottom: 6px; color: #15803D;
}
.cs-edu-sidebar {
  float: right; width: 36%; margin: 0 0 10px 14px; padding: 8px 10px;
  background: #FEF2F2; border: 1px solid #FECACA; border-radius: 4px;
  font-size: 11px; color: #7F1D1D;
}

/* TR-16 lookup table styles */
.tr16-table {
  border-collapse: collapse; width: 100%; font-size: 10.5px;
  font-family: var(--font-mono); margin: 10px 0;
}
.tr16-table th, .tr16-table td {
  border: 1px solid #94A3B8; padding: 3px 5px; text-align: center;
}
.tr16-table th { background: #E2E8F0; color: #0F172A; font-weight: 700; }
.tr16-table .tr16-highlight { background: #FEF08A; font-weight: 700; }
.tr16-caption {
  font-size: 11.5px; font-weight: 700; margin: 10px 0 4px;
  color: #0B1220;
}

.btn-primary {
  all: unset; cursor: pointer; padding: 8px 14px; border-radius: 6px;
  background: var(--accent); color: var(--bg); font-weight: 600; font-size: 13px;
}
.btn-primary:hover { background: #2BAE9D; }

</style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div style="display: grid; grid-template-rows: auto 1fr;">
      <div id="topbar" class="topbar"></div>
      <main id="main" class="main"></main>
    </div>
  </div>
  <div id="printArea"></div>

// ─ src/calc.mjs ─

// src/calc.mjs — pure calculation engine. Mirrors workbook/calculations.py.
// All volumes in cubic feet (CF), depths in inches, areas in square feet.
const RV = {
  'Impervious Vehicular':     0.95,
  'Impervious Non-Vehicular': 0.95,
  'Compacted (Open Space)':   0.25,
  'Natural (Woods)':          0.00,
  'BMP':                      0.00,
};
const CN = {
  'Impervious Vehicular':     { A: 98, B: 98, C: 98, D: 98 },
  'Impervious Non-Vehicular': { A: 98, B: 98, C: 98, D: 98 },
  'BMP':                      { A: 98, B: 98, C: 98, D: 98 },
  'Natural (Woods)':          { A: 25, B: 55, C: 70, D: 77 },
  'Compacted (Open Space)':   { A: 39, B: 61, C: 74, D: 80 },
};

const HORTON = {
  B: { fMax: 5.0, fMin: 0.3, k: 2.0 },
  C: { fMax: 3.0, fMin: 0.1, k: 3.5 },
};

const DEPRESSION_IMPERVIOUS = 0.1;
const DEPRESSION_PERVIOUS   = 0.2;

const IMPERVIOUS_LAND_USES = new Set([
  'Impervious Vehicular', 'Impervious Non-Vehicular', 'BMP',
]);

// ─── Formatting helpers ──────────────────────────────────────────────────────
const fmt = (n, places = 2) => {
  if (n === 0) return '0';
  if (Math.abs(n) < 0.01 && n !== 0) return n.toExponential(2);
  return n.toFixed(places).replace(/\.?0+$/, '');
};

// ─── SWRv ────────────────────────────────────────────────────────────────────
function swrvVolume(areas, rainfallIn) {
  const terms = [
    { name: 'Imp Veh',     area: areas.impVeh    || 0, rv: RV['Impervious Vehicular'] },
    { name: 'Imp Non-Veh', area: areas.impNonVeh || 0, rv: RV['Impervious Non-Vehicular'] },
    { name: 'Compacted',   area: areas.comp      || 0, rv: RV['Compacted (Open Space)'] },
    { name: 'Natural',     area: areas.natural   || 0, rv: RV['Natural (Woods)'] },
    { name: 'BMP',         area: areas.bmp       || 0, rv: RV['BMP'] },
  ];
  const sumAR = terms.reduce((s, t) => s + t.area * t.rv, 0);
  const value = sumAR * rainfallIn / 12.0;
  const subTerms = terms
    .filter(t => t.area > 0)
    .map(t => `${t.area}·${t.rv}`)
    .join(' + ') || '0';
  return {
    value,
    units: 'cf',
    steps: [
      { expr:   'SWRv = (P / 12) × Σ(A_i · Rv_i)',
        sub:    `(${rainfallIn} / 12) × (${subTerms})`,
        eval:   `${fmt(rainfallIn / 12, 4)} × ${fmt(sumAR)}`,
        result: value },
    ],
  };
}

// ─── TR-55 runoff ────────────────────────────────────────────────────────────
function tr55RunoffDepth(P, cn) {
  if (cn <= 0) return 0;
  const S = 1000 / cn - 10;
  const Ia = 0.2 * S;
  if (P <= Ia) return 0;
  return (P - Ia) ** 2 / (P - Ia + S);
}
function tr55RunoffVolumeCf(areaSf, P, cn) {
  return areaSf * tr55RunoffDepth(P, cn) / 12;
}
function tr55TotalVolumeCf(rows, P) {
  let total = 0;
  for (const [area, landUse, hsg] of rows) {
    const row = CN[landUse];
    if (!row || row[hsg] == null) {
      throw new Error(`No CN entry for ('${landUse}', '${hsg}')`);
    }
    total += tr55RunoffVolumeCf(area, P, row[hsg]);
  }
  return total;
}

// ─── Horton infiltration (closed form) ───────────────────────────────────────
function hortonInfilLoss(fMax, fMin, k, T = 24) {
  return fMin * T + (fMax - fMin) / k * (1 - Math.exp(-k * T));
}
const HORTON_INFIL_LOSS_B = hortonInfilLoss(HORTON.B.fMax, HORTON.B.fMin, HORTON.B.k, 24);
const HORTON_INFIL_LOSS_C = hortonInfilLoss(HORTON.C.fMax, HORTON.C.fMin, HORTON.C.k, 24);

// ─── EISA Direct Determination ───────────────────────────────────────────────
function eisaDirectRunoffDepth(landUse, hsg, P) {
  if (IMPERVIOUS_LAND_USES.has(landUse)) {
    return Math.max(0, P - DEPRESSION_IMPERVIOUS);
  }
  if (hsg === 'A') return 0;
  if (hsg === 'B') return Math.max(0, P - DEPRESSION_PERVIOUS - HORTON_INFIL_LOSS_B);
  if (hsg === 'C') return Math.max(0, P - DEPRESSION_PERVIOUS - HORTON_INFIL_LOSS_C);
  if (hsg === 'D') return Math.max(0, P - DEPRESSION_PERVIOUS);
  throw new Error(`Unknown HSG: ${hsg}`);
}
function eisaDirectTotalVolumeCf(rows, P) {
  let total = 0;
  for (const [area, landUse, hsg] of rows) {
    total += area * eisaDirectRunoffDepth(landUse, hsg, P) / 12;
  }
  return total;
}

// ─── BMP sizing ──────────────────────────────────────────────────────────────
function ppSizingSv(sa, dReservoir, nReservoir) {
  const value = sa * dReservoir * nReservoir;
  return {
    value,
    units: 'cf',
    steps: [
      { expr:   'Sv = SA × d_reservoir × n_reservoir',
        sub:    `${sa} × ${dReservoir} × ${nReservoir}`,
        eval:   `${sa * dReservoir} × ${nReservoir}`,
        result: value },
    ],
  };
}
function bioSizingSv(saBot, saTop, saPondTop, dMedia, nMedia, dGravel, nGravel, dPond) {
  const mediaGravelSv = saBot * (dMedia * nMedia + dGravel * nGravel);
  const useTrapezoid = saPondTop != null && saPondTop > 0;
  const pondSv = useTrapezoid
    ? 0.5 * (saTop + saPondTop) * dPond
    : saBot * dPond;
  const value = mediaGravelSv + pondSv;
  const subs = useTrapezoid
    ? `${saBot}·(${dMedia}·${nMedia} + ${dGravel}·${nGravel}) + ½·(${saTop} + ${saPondTop})·${dPond}`
    : `${saBot}·(${dMedia}·${nMedia} + ${dGravel}·${nGravel} + ${dPond})`;
  return {
    value,
    units: 'cf',
    components: { mediaGravelSv, pondSv },
    pondModel: useTrapezoid ? 'trapezoid' : 'vertical',
    steps: [{
      expr: useTrapezoid
        ? 'Sv = SA_bot·(d_media·n_media + d_gravel·n_gravel) + ½·(SA_top + SA_pond_top)·d_pond'
        : 'Sv = SA_bot·(d_media·n_media + d_gravel·n_gravel + d_pond)',
      sub: subs,
      eval: `${mediaGravelSv.toFixed(2)} + ${pondSv.toFixed(2)}`,
      result: value,
    }],
  };
}
function drySwaleSizingSv({
  saBot, dMedia, nMedia, dGravel, nGravel, dPond,
  length, bottomWidth, invUs, invDs,
  checkDamHeight, checkDamSpacing,
}) {
  const mediaGravelSv = saBot * (dMedia * nMedia + dGravel * nGravel);
  const haveGeom = length > 0 && bottomWidth > 0
                && invUs != null && invDs != null
                && checkDamHeight > 0 && checkDamSpacing > 0;
  let pondSv, pondModel, pondTrace;
  if (haveGeom) {
    const slope = Math.max(1e-6, (invUs - invDs) / length);
    const nDams = Math.max(0, Math.floor(length / checkDamSpacing));
    const fullWedgeBase = checkDamHeight / slope;
    const effectiveBase = Math.min(checkDamSpacing, fullWedgeBase);
    const wedgePerDam = 0.5 * effectiveBase * checkDamHeight * bottomWidth;
    pondSv = nDams * wedgePerDam;
    pondModel = 'wedge';
    pondTrace = { slope, nDams, fullWedgeBase, effectiveBase, wedgePerDam };
  } else {
    pondSv = saBot * (dPond || 0);
    pondModel = 'flat-fallback';
    pondTrace = null;
  }
  const value = mediaGravelSv + pondSv;
  return {
    value,
    units: 'cf',
    components: { mediaGravelSv, pondSv },
    pondModel,
    pondTrace,
    steps: [{
      expr: haveGeom
        ? 'Sv = SA_bot·(d_media·n_media + d_gravel·n_gravel) + N_cd · ½·min(X_cd, H_cd/S)·H_cd·w_s'
        : 'Sv = SA_bot·(d_media·n_media + d_gravel·n_gravel + d_pond)',
      sub: haveGeom
        ? `${saBot}·(${dMedia}·${nMedia} + ${dGravel}·${nGravel}) + ${pondTrace.nDams}·½·${pondTrace.effectiveBase}·${checkDamHeight}·${bottomWidth}`
        : `${saBot}·(${dMedia}·${nMedia} + ${dGravel}·${nGravel} + ${dPond})`,
      eval: `${mediaGravelSv.toFixed(2)} + ${pondSv.toFixed(2)}`,
      result: value,
    }],
  };
}
function bioFreeboardFt({ topElev, dPond, overflowElev, sidewalkElev, curbCutElev }) {
  if (topElev == null || dPond == null) return null;
  const containments = [overflowElev, sidewalkElev, curbCutElev].filter(e => e != null);
  if (!containments.length) return null;
  return Math.min(...containments) - (topElev + dPond);
}
function drySwaleFreeboardFt({ invUs, invDs, topUs, topDs, checkDamHeight }) {
  if (invUs == null || invDs == null || topUs == null || topDs == null || !checkDamHeight) return null;
  return Math.min(topUs - (invUs + checkDamHeight), topDs - (invDs + checkDamHeight));
}
function rvFromSv(sv, retMultiplier) {
  const value = sv * retMultiplier;
  return {
    value,
    units: 'cf',
    steps: [
      { expr:   'Rv = Sv × retention_multiplier',
        sub:    `${sv} × ${retMultiplier}`,
        eval:   `${sv} × ${retMultiplier}`,
        result: value },
    ],
  };
}
function maxBmpCredit(cdaAreaSf, maxCreditInches = 1.7) {
  const value = cdaAreaSf * maxCreditInches / 12;
  return {
    value,
    units: 'cf',
    steps: [
      { expr:   'Max BMP Credit = CDA area × 1.7 / 12',
        sub:    `${cdaAreaSf} × ${maxCreditInches} / 12`,
        eval:   `${(cdaAreaSf * maxCreditInches).toFixed(2)} / 12`,
        result: value },
    ],
  };
}

const TREE_COUNT_KEY = {
  plantedSmall:     'T-1 Small',
  plantedLarge:     'T-1 Large',
  preservedSmall:   'T-2 Small',
  preservedLarge:   'T-2 Large',
  preservedSpecial: 'T-2 Special',
  preservedHeritage:'T-2 Heritage',
};
function treeRetentionCredit(counts, treeCredits) {
  const lines = [];
  let value = 0;
  for (const [countKey, creditKey] of Object.entries(TREE_COUNT_KEY)) {
    const n = counts[countKey] || 0;
    if (!n) continue;
    const credit = treeCredits[creditKey] || 0;
    value += n * credit;
    lines.push(`${n}×${credit}`);
  }
  return {
    value,
    units: 'cf',
    steps: [
      { expr:   'Rv_trees = Σ (count × credit)',
        sub:    lines.join(' + ') || '0',
        eval:   `${value}`,
        result: value },
    ],
  };
}

// ─── Composite CN + detention ────────────────────────────────────────────────
function compositeCn(areas, cnByLandUse) {
  const keys = Object.keys(areas);
  const totalArea = keys.reduce((s, k) => s + (areas[k] || 0), 0);
  if (totalArea === 0) return { value: 0, units: '', steps: [] };
  const num = keys.reduce((s, k) => s + (areas[k] || 0) * cnByLandUse[k], 0);
  const value = num / totalArea;
  const subs = keys
    .filter(k => areas[k] > 0)
    .map(k => `${areas[k]}·${cnByLandUse[k]}`)
    .join(' + ');
  return {
    value,
    units: '',
    steps: [
      { expr:   'CN = Σ(A_i · CN_i) / Σ A_i',
        sub:    `(${subs}) / ${totalArea}`,
        eval:   `${num.toFixed(0)} / ${totalArea}`,
        result: value },
    ],
  };
}
const scsRunoffDepth = tr55RunoffDepth;

const LAND_USE_TO_DETENTION_KEY = {
  'Natural (Woods)':          'Natural',
  'Compacted (Open Space)':   'Compacted',
  'Impervious Vehicular':     'Impervious',
  'Impervious Non-Vehicular': 'Impervious',
  'BMP':                      'BMP',
};

function _sdaAreasFromRows(sdaRows, which) {
  // which = 'pre' | 'post'
  const key = which + 'In';
  const out = { Natural: 0, Compacted: 0, Impervious: 0, BMP: 0 };
  for (const row of sdaRows) {
    const k = LAND_USE_TO_DETENTION_KEY[row.landUse];
    if (k) out[k] += row[key] || 0;
  }
  return out;
}
function detentionSummary(sdas, p2In, p15In, detentionCn) {
  // sdas can either be: (a) list of per-SDA {sdaId, pre, post} objects (pre-aggregated), or
  // (b) list of SDA data rows with landUse + preIn + postIn. We detect by checking for
  //     'pre' / 'post' keys on the first element.
  let perSdaInput;
  if (sdas.length === 0) {
    perSdaInput = [];
  } else if ('pre' in sdas[0] && 'post' in sdas[0]) {
    perSdaInput = sdas;
  } else {
    // Group raw rows by sdaId first.
    const by = {};
    for (const r of sdas) {
      if (!by[r.sdaId]) by[r.sdaId] = [];
      by[r.sdaId].push(r);
    }
    perSdaInput = Object.entries(by).map(([sdaId, rows]) => ({
      sdaId,
      pre:  _sdaAreasFromRows(rows, 'pre'),
      post: _sdaAreasFromRows(rows, 'post'),
    }));
  }

  const perSda = perSdaInput.map(sda => {
    const preCn  = compositeCn(sda.pre,  detentionCn).value;
    const postCn = compositeCn(sda.post, detentionCn).value;
    const p2PreQ   = scsRunoffDepth(p2In,  preCn);
    const p2PostQ  = scsRunoffDepth(p2In,  postCn);
    const p15PreQ  = scsRunoffDepth(p15In, preCn);
    const p15PostQ = scsRunoffDepth(p15In, postCn);
    return {
      sdaId: sda.sdaId,
      preCn, postCn,
      p2PreQ, p2PostQ, p2Required: p2PostQ > p2PreQ,
      p15PreQ, p15PostQ, p15Required: p15PostQ > p15PreQ,
    };
  });
  const anyRequired = perSda.some(s => s.p2Required || s.p15Required);
  return { perSda, anyRequired };
}

// ─── Site aggregates ─────────────────────────────────────────────────────────

const LAND_USE_TO_SITE_KEY = {
  'Natural (Woods)':          'natural',
  'Compacted (Open Space)':   'compacted',
  'Impervious Vehicular':     'impervious',
  'Impervious Non-Vehicular': 'impervious',
  'BMP':                      'bmp',
};
function siteAggregateLandCover(sdas) {
  const empty = () => ({ natural: 0, compacted: 0, impervious: 0, bmp: 0 });
  const pre = empty();
  const post = empty();
  for (const row of sdas) {
    const k = LAND_USE_TO_SITE_KEY[row.landUse];
    if (!k) continue;
    pre[k]  += row.preIn  || 0;
    post[k] += row.postIn || 0;
  }
  const total = (o) => o.natural + o.compacted + o.impervious + o.bmp;
  return {
    pre, post,
    preTotal:  total(pre),
    postTotal: total(post),
    impPctPre:  total(pre)  ? pre.impervious  / total(pre)  * 100 : 0,
    impPctPost: total(post) ? post.impervious / total(post) * 100 : 0,
  };
}
function siteSwrv(sdas, rainfallIn, params) {
  const terms = sdas.map(r => ({
    landUse: r.landUse,
    area:    r.postIn || 0,
    rv:      params.rv[r.landUse] || 0,
  })).filter(t => t.area > 0);
  const sumAR = terms.reduce((s, t) => s + t.area * t.rv, 0);
  const value = sumAR * rainfallIn / 12;
  const subs = terms.map(t => `${t.area}·${t.rv}`).join(' + ') || '0';
  return {
    value,
    units: 'cf',
    steps: [
      { expr:   'Site SWRv = (P/12) × Σ(A_i · Rv_i)   [informational — compliance is per-SDA]',
        sub:    `(${rainfallIn}/12) × (${subs})`,
        eval:   `${(rainfallIn/12).toFixed(4)} × ${sumAR.toFixed(2)}`,
        result: value },
    ],
  };
}

// ─── Trace variants used by EISA render pages ───────────────────────────────
// Row shape divergence: trace variants take `{area, landUse, hsg}` objects
// (easier to destructure in .map and makes perRow output self-describing).
// The scalar siblings eisaDirectTotalVolumeCf and tr55TotalVolumeCf take
// `[area, landUse, hsg]` tuples. If you call both from one call site, build
// two row arrays.
function eisaDirectVolumeTraceCf(rows, P) {
  const perRow = rows.map(r => {
    if (!['A', 'B', 'C', 'D'].includes(r.hsg)) {
      throw new Error(`No EISA Direct entry for ('${r.landUse}', '${r.hsg}')`);
    }
    const depth = eisaDirectRunoffDepth(r.landUse, r.hsg, P);
    return {
      landUse: r.landUse,
      hsg: r.hsg,
      area: r.area,
      depthIn: depth,
      volumeCf: r.area * depth / 12,
    };
  });
  const value = perRow.reduce((s, r) => s + r.volumeCf, 0);
  return {
    value,
    units: 'cf',
    perRow,
    steps: [
      { expr: 'EISA Direct — total runoff = Σ (A_i × depth_i / 12)',
        sub:  `Σ over ${perRow.length} rows`,
        eval: `${perRow.map(r => `${r.area}·${r.depthIn.toFixed(3)}/12`).join(' + ')}`,
        result: value },
    ],
  };
}

// ─── Time of Concentration (NRCS TR-55) ─────────────────────────────────────

// Shallow-concentrated flow velocity coefficients (TR-55 Fig 3-1).
// Template dropdown offers only "paved" / "unpaved"; the workbook formula
// treats anything other than "paved" as unpaved.
const SHALLOW_FLOW_K = {
  paved:   20.3282,
  unpaved: 16.1345,
};
function tcSheetFlow({ length, slope, n, P2 }) {
  if (!(length > 0 && slope > 0 && n > 0 && P2 > 0)) return null;
  const Tt_hr = 0.007 * Math.pow(n * length, 0.8)
              / (Math.pow(P2, 0.5) * Math.pow(slope, 0.4));
  return Tt_hr * 60;
}
function tcShallowFlow({ length, slope, surface }) {
  if (!(length > 0 && slope > 0)) return null;
  const key = String(surface ?? '').trim().toLowerCase();
  const k = SHALLOW_FLOW_K[key] ?? SHALLOW_FLOW_K.unpaved;
  const V = k * Math.sqrt(slope);
  return length / (V * 60);
}
function tcChannelFlow({ length, velocity }) {
  if (!(length > 0 && velocity > 0)) return null;
  return length / (velocity * 60);
}
function timeOfConcentration(segments) {
  const perSegment = segments.map(s => {
    if (s.type === 'sheet')   return tcSheetFlow(s);
    if (s.type === 'shallow') return tcShallowFlow(s);
    if (s.type === 'channel') return tcChannelFlow(s);
    return null;
  });
  const total = perSegment.reduce((a, t) => a + (t || 0), 0);
  // TR-55 / DOEE floor: Tc_final >= 0.1 hr (6 min).
  return Math.max(total, 6);
}

// Final Tc in minutes: a direct entry overrides the computed sum, and the
// TR-55 / DOEE 6-minute floor applies to both paths.
function tcFinalMin(tcDirectMin, segments) {
  if (tcDirectMin != null) return Math.max(tcDirectMin, 6);
  if (!segments || segments.length === 0) return null;
  return timeOfConcentration(segments);
}
function tr55VolumeTraceCf(rows, P) {
  const perRow = rows.map(r => {
    const cnRow = CN[r.landUse];
    if (!cnRow || cnRow[r.hsg] == null) {
      throw new Error(`No CN entry for ('${r.landUse}', '${r.hsg}')`);
    }
    const cn = cnRow[r.hsg];
    const depth = tr55RunoffDepth(P, cn);
    return {
      landUse: r.landUse,
      hsg: r.hsg,
      area: r.area,
      cn,
      depthIn: depth,
      volumeCf: r.area * depth / 12,
    };
  });
  const value = perRow.reduce((s, r) => s + r.volumeCf, 0);
  return {
    value,
    units: 'cf',
    perRow,
    steps: [
      { expr: 'TR-55 — Q = (P − 0.2S)² / (P + 0.8S)   where S = 1000/CN − 10',
        sub:  `Σ over ${perRow.length} rows (A × Q / 12)`,
        eval: `${perRow.map(r => `${r.area}·${r.depthIn.toFixed(3)}/12`).join(' + ')}`,
        result: value },
    ],
  };
}

// ─── TR-55 Graphical Peak Discharge (Appendix F) ────────────────────────────

// NRCS TR-55 unit peak discharge (Appendix F log-polynomial).
// paramsTr55 shape: [[IaP, C0, C1, C2], ...] sorted ascending by IaP.
// Returns qu in csm/in. Clamps IaP to [first, last] bin; linear interpolation between bins.
function tr55UnitPeakDischarge(tcHr, iaOverP, paramsTr55) {
  if (!(tcHr > 0) || !paramsTr55 || paramsTr55.length < 2) return null;
  const N = paramsTr55.length;
  const iaFirst = paramsTr55[0][0], iaLast = paramsTr55[N - 1][0];
  const iap = Math.min(Math.max(iaOverP, iaFirst), iaLast);
  let lo = 0;
  for (let i = 0; i < N - 1; i++) {
    if (paramsTr55[i][0] <= iap && paramsTr55[i + 1][0] >= iap) { lo = i; break; }
  }
  if (iap >= iaLast) lo = N - 2;
  const hi = lo + 1;
  const [iapLo, c0Lo, c1Lo, c2Lo] = paramsTr55[lo];
  const [iapHi, c0Hi, c1Hi, c2Hi] = paramsTr55[hi];
  const f = (iap - iapLo) / (iapHi - iapLo);
  const C0 = c0Lo + f * (c0Hi - c0Lo);
  const C1 = c1Lo + f * (c1Hi - c1Lo);
  const C2 = c2Lo + f * (c2Hi - c2Lo);
  const lt = Math.log10(tcHr);
  return Math.pow(10, C0 + C1 * lt + C2 * lt * lt);
}

// TR-55 Eq 4-1: Qp = qu * Am * Q * Fp; Fp = 1.0.
function tr55PeakDischargeCfs(qu, areaMi2, runoffIn) {
  if (qu == null || !(areaMi2 > 0)) return null;
  return qu * areaMi2 * (runoffIn || 0);
}


// ─ src/parse.mjs ─

// src/parse.mjs — XLSX → structured JS object. SheetJS workbook comes from caller.

const REQUIRED_SHEETS = ['PROJECT', 'SDA_Existing', 'SDA_Proposed',
                         'CDA_Existing', 'CDA_Proposed', 'BMP', 'PARAMS'];

const LEGACY_SHEETS = ['SDA', 'CDA'];

// Data scan starts at row 4. Rather than a hard-coded last row, we scan
// until EMPTY_ROW_SENTINEL consecutive fully-empty input rows have been
// seen AFTER at least one data row, allowing users to add arbitrary rows
// beyond the template's n_rows. Summary rollups moved off these sheets
// onto Area_Summary (see workbook/builders/area_summary.py), so there is
// no risk of colliding with an "SDA-1"/"CDA-1" summary label.
const DATA_FIRST_ROW = 4;
const EMPTY_ROW_SENTINEL = 5;
// Hard safety ceiling in case someone leaves styled-but-empty cells way
// below the data. Practically no real project reaches this.
const DATA_MAX_ROW = 10000;

function rejectLegacySchema(wb) {
  for (const name of LEGACY_SHEETS) {
    if (wb.SheetNames.includes(name) &&
        !wb.SheetNames.includes(`${name}_Existing`)) {
      throw new Error(
        `This workbook uses the old ${name} pre/post layout. ` +
        `Regenerate from the current blank template ` +
        `(SW_Required_Provided_DOEE_EISA438.xlsx).`);
    }
  }
}

function requireSheet(wb, name) {
  if (!wb.SheetNames.includes(name)) {
    throw new Error(`Missing sheet: ${name}`);
  }
  return wb.Sheets[name];
}

// Returns null when the sheet is absent so workbooks that pre-date a
// schema change still parse instead of throwing.
function optionalSheet(wb, name) {
  if (!wb.SheetNames.includes(name)) return null;
  return wb.Sheets[name] ?? null;
}

function colToLetters(col) {
  // 1 → 'A', 26 → 'Z', 27 → 'AA', 28 → 'AB', …
  let s = '';
  while (col > 0) {
    const r = (col - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    col = Math.floor((col - 1) / 26);
  }
  return s;
}

function cell(sheet, row, col) {
  const ref = `${colToLetters(col)}${row}`;
  const c = sheet[ref];
  return c == null ? null : c.v;
}

// PROJECT layout (from workbook/builders/project.py):
//   col A = labels; col B = values (rows 3-12):
//   3=name, 4=number, 5=ms4, 6=awdz, 7=doeeReview,
//   8=totalLod, 9=rainfallRetention, 10=rainfallEisa, 11=trigger, 12=eisa438Applies
function parseProject(sheet) {
  const retention = cell(sheet, 9, 2);
  const eisa = cell(sheet, 10, 2);
  if (retention == null || eisa == null) {
    throw new Error('Missing PROJECT!B9 (Retention) or !B10 (EISA)');
  }
  return {
    name: cell(sheet, 3, 2),
    number: cell(sheet, 4, 2),
    ms4: cell(sheet, 5, 2),
    awdz: cell(sheet, 6, 2),
    doeeReview: cell(sheet, 7, 2),
    totalLod: cell(sheet, 8, 2),
    rainfallRetention: retention,
    rainfallEisa: eisa,
    trigger: cell(sheet, 11, 2),
    eisa438Applies: cell(sheet, 12, 2),
  };
}

// SDA layout (10 cols A-J per split sheet):
//   A=sdaId, B=inProw, C=landUse, D=hsg,
//   E=areaIn (Area Within LOD), F=areaOut (Area Outside LOD),
//   G-J = formula cells (Rv, Rainfall, SWRv Within, SWRv Outside) — not parsed.
function parseSdaRow(sheet, row) {
  return {
    sdaId:   cell(sheet, row, 1),
    inProw:  cell(sheet, row, 2),
    landUse: cell(sheet, row, 3),
    hsg:     cell(sheet, row, 4),
    areaIn:  cell(sheet, row, 5),
    areaOut: cell(sheet, row, 6),
  };
}

function _isEmptyInputRow(row) {
  // An "empty" input row has NO value across all 6 user-input cols.
  // Checking all 6 (vs. just A/C) tolerates users who type areas before
  // picking a dropdown, and vice versa.
  return row.sdaId == null && row.inProw == null && row.landUse == null
      && row.hsg == null && row.areaIn == null && row.areaOut == null;
}

function _isEmptyCdaInputRow(row) {
  return row.cdaId == null && row.sdaId == null && row.landUse == null
      && row.hsg == null && row.areaIn == null && row.areaOut == null;
}

function _scanInputRows(sheet, parseRow, isEmpty) {
  // Scan from DATA_FIRST_ROW; stop after EMPTY_ROW_SENTINEL consecutive
  // empty rows seen AFTER at least one data row. Keeps non-empty rows
  // even if interleaved with 1-4 blank separator rows.
  const rows = [];
  let seenData = false;
  let emptyStreak = 0;
  for (let r = DATA_FIRST_ROW; r <= DATA_MAX_ROW; r++) {
    const row = parseRow(sheet, r);
    if (isEmpty(row)) {
      if (seenData) {
        emptyStreak++;
        if (emptyStreak >= EMPTY_ROW_SENTINEL) break;
      }
      continue;
    }
    seenData = true;
    emptyStreak = 0;
    rows.push(row);
  }
  return rows;
}

function parseSdaSheet(sheet) {
  return _scanInputRows(sheet, parseSdaRow, _isEmptyInputRow);
}

// CDA layout (10 cols A-J per split sheet):
//   A=cdaId, B=sdaId, C=landUse, D=hsg,
//   E=areaIn (Area Within LOD), F=areaOut (Area Outside LOD),
//   G-J = formula cells — not parsed.
function parseCdaRow(sheet, row) {
  return {
    cdaId:   cell(sheet, row, 1),
    sdaId:   cell(sheet, row, 2),
    landUse: cell(sheet, row, 3),
    hsg:     cell(sheet, row, 4),
    areaIn:  cell(sheet, row, 5),
    areaOut: cell(sheet, row, 6),
  };
}

function parseCdaSheet(sheet) {
  return _scanInputRows(sheet, parseCdaRow, _isEmptyCdaInputRow);
}

// BMP layout:
//   Old 66-col schema: headers row 3, data starts row 4.
//   New 81-col schema (commit 2a950f3): banners row 3, column labels row 4,
//     USER/AUTO/DROPDOWN legend row 5, data starts row 6.
//   Auto-detect by checking whether row 4 col A looks like a header label.
//   Conditional cols by BMP type (unchanged between schemas for parsed fields):
//     Permeable Pavement:   F=sa, G=dReservoir
//     Bioretention/DrySwale: N=saTop, O=saBot, Q=dMedia, S=dGravel, U=dPond
//     Planted/Preserve Trees: AB..AG = plantedSmall..preservedHeritage
//   Wet Swale (cols Y, Z) is not currently parsed — add here when needed.
function _detectBmpFirstRow(sheet) {
  // Row 4 col A is the BMP Name header on the new schema, or the first BMP
  // name on the old schema. Treat a string that looks like a label as the
  // header signal.
  const row4A = cell(sheet, 4, 1);
  if (typeof row4A === 'string' && row4A.trim().toLowerCase() === 'bmp name') {
    return 6;
  }
  return 4;
}
function parseBmp(sheet) {
  const rows = [];
  const firstRow = _detectBmpFirstRow(sheet);
  for (let r = firstRow; r <= DATA_MAX_ROW; r++) {
    const name = cell(sheet, r, 1);
    // BMPs are contiguous; first empty name = end of list.
    if (!name) break;
    const type = cell(sheet, r, 4);
    const row = {
      name,
      sdaId: cell(sheet, r, 2),
      cdaId: cell(sheet, r, 3),
      type,
      subType: cell(sheet, r, 5),
    };
    if (type === 'Permeable Pavement') {
      row.pp = {
        sa: cell(sheet, r, 6) || 0,
        dReservoir: cell(sheet, r, 7) || 0,
      };
    } else if (type === 'Bioretention') {
      row.bio = {
        saTop:        cell(sheet, r, 14) || 0,
        saBot:        cell(sheet, r, 15) || 0,
        dMedia:       cell(sheet, r, 17) || 0,
        dGravel:      cell(sheet, r, 19) || 0,
        dPond:        cell(sheet, r, 21) || 0,
        // NEW optional geometry — null if blank, not 0.
        saPondTop:    cell(sheet, r, 40),
        topElev:      cell(sheet, r, 41),
        overflowElev: cell(sheet, r, 42),
        sidewalkElev: cell(sheet, r, 43),
        curbCutElev:  cell(sheet, r, 44),
      };
    } else if (type === 'Dry Swale') {
      row.swale = {
        saTop:           cell(sheet, r, 14) || 0,
        saBot:           cell(sheet, r, 15) || 0,
        dMedia:          cell(sheet, r, 17) || 0,
        dGravel:         cell(sheet, r, 19) || 0,
        dPond:           cell(sheet, r, 21) || 0,
        // NEW optional channel geometry — null if blank.
        length:          cell(sheet, r, 46),
        bottomWidth:     cell(sheet, r, 47),
        invUs:           cell(sheet, r, 48),
        invDs:           cell(sheet, r, 49),
        topUs:           cell(sheet, r, 50),
        topDs:           cell(sheet, r, 51),
        checkDamHeight:  cell(sheet, r, 52),
        checkDamSpacing: cell(sheet, r, 53),
      };
    } else if (type === 'Planted Trees' || type === 'Preserve Trees') {
      row.trees = {
        plantedSmall: cell(sheet, r, 28) || 0,
        plantedLarge: cell(sheet, r, 29) || 0,
        preservedSmall: cell(sheet, r, 30) || 0,
        preservedLarge: cell(sheet, r, 31) || 0,
        preservedSpecial: cell(sheet, r, 32) || 0,
        preservedHeritage: cell(sheet, r, 33) || 0,
      };
    }
    rows.push(row);
  }
  return rows;
}

function parseParams(sheet) {
  // PARAMS layout (from workbook/builders/params.py):
  //   Rv table: rows 7-11 cols A-B
  //   CN table: rows 15-18 cols A-E (A=land use label, B-E = HSG A-D)
  //   BMP design: rows 36-42 cols A-G (A=type, B=subtype, F=ret multiplier)
  //   Tree credits: rows 46-51 cols A-C (A=code, C=credit CF)
  //   Detention storm depths: rows 55-57 cols A-B (A=label, B=inches)
  //   Detention CN defaults: rows 61-64 cols A-B (A=label, B=cn)

  const rv = {};
  for (let r = 7; r <= 11; r++) {
    const label = cell(sheet, r, 1);
    if (label) rv[label] = cell(sheet, r, 2);
  }

  const cn = {};
  for (let r = 15; r <= 18; r++) {
    const label = cell(sheet, r, 1);
    if (!label) continue;
    // The PARAMS table uses "Impervious" (collapsed). Fan out to both vehicular
    // and non-vehicular + BMP so lookups by SDA land use work directly.
    const row = {
      A: cell(sheet, r, 2),
      B: cell(sheet, r, 3),
      C: cell(sheet, r, 4),
      D: cell(sheet, r, 5),
    };
    if (label === 'Impervious') {
      cn['Impervious Vehicular'] = row;
      cn['Impervious Non-Vehicular'] = row;
    } else {
      cn[label] = row;
    }
  }

  const bmpDesign = {};
  for (let r = 36; r <= 42; r++) {
    const type = cell(sheet, r, 1);
    const subType = cell(sheet, r, 2);
    if (!type) continue;
    const key = `${type} / ${subType}`;
    bmpDesign[key] = {
      nMedia:      typeof cell(sheet, r, 3) === 'number' ? cell(sheet, r, 3) : null,
      nGravel:     typeof cell(sheet, r, 4) === 'number' ? cell(sheet, r, 4) : null,
      nReservoir:  typeof cell(sheet, r, 5) === 'number' ? cell(sheet, r, 5) : null,
      retMultiplier: cell(sheet, r, 6),
      maxDrawdownDays: cell(sheet, r, 7),
    };
  }

  const treeCredits = {};
  for (let r = 46; r <= 51; r++) {
    const code = cell(sheet, r, 1);
    if (code) treeCredits[code] = cell(sheet, r, 3);
  }

  const detention = {
    p2In: cell(sheet, 55, 2),
    p15In: cell(sheet, 56, 2),
    p100In: cell(sheet, 57, 2),
  };

  const detentionCn = {};
  for (let r = 61; r <= 64; r++) {
    const label = cell(sheet, r, 1);
    if (label) detentionCn[label] = cell(sheet, r, 2);
  }

  // TR-55 Appendix F coefficients: rows 76-81, cols A-D = [Ia/P, C0, C1, C2].
  const tr55 = [];
  for (let r = 76; r <= 81; r++) {
    const iap = cell(sheet, r, 1);
    if (iap == null) continue;
    tr55.push([iap, cell(sheet, r, 2), cell(sheet, r, 3), cell(sheet, r, 4)]);
  }

  return { rv, cn, bmpDesign, treeCredits, detention, detentionCn, tr55 };
}

/**
 * Parse a SheetJS workbook into the structured object every downstream module
 * consumes. The `bmps` array has a conditional shape — pp/bio/trees sub-objects
 * are only present for matching BMP types.
 *
 * SDA and CDA data are exposed as split existing/proposed arrays; each row has
 * `areaIn` (within LOD) and `areaOut` (outside LOD) rather than pre/post fields.
 *
 * @param {{SheetNames: string[], Sheets: Record<string, object>}} wb
 * @returns {{
 *   project: {name, number, ms4, awdz, doeeReview, totalLod,
 *             rainfallRetention, rainfallEisa, trigger, eisa438Applies},
 *   sdaExisting: Array<{sdaId, inProw, landUse, hsg, areaIn, areaOut}>,
 *   sdaProposed: Array<{sdaId, inProw, landUse, hsg, areaIn, areaOut}>,
 *   cdaExisting: Array<{cdaId, sdaId, landUse, hsg, areaIn, areaOut}>,
 *   cdaProposed: Array<{cdaId, sdaId, landUse, hsg, areaIn, areaOut}>,
 *   bmps:    Array<{name, sdaId, cdaId, type, subType,
 *                   pp?:    {sa, dReservoir},
 *                   bio?:   {saTop, saBot, dMedia, dGravel, dPond},
 *                   trees?: {plantedSmall, plantedLarge, preservedSmall, preservedLarge, preservedSpecial, preservedHeritage}}>,
 *   params:  {rv, cn, bmpDesign, treeCredits, detention: {p2In, p15In, p100In},
 *             detentionCn, tr55: Array<[IaP, C0, C1, C2]>}
 * }}
 * @throws if a legacy-schema workbook is detected, if a required sheet is missing,
 *         or if PROJECT!B9/B10 (Retention/EISA rainfall) are empty.
 */
// Merge the Existing + Proposed arrays into the pre-split {preIn, preOut,
// postIn, postOut} shape so downstream consumers (render.mjs, ui.mjs, calc)
// don't need rewiring for the schema change.
function _mergeSdaCompat(existing, proposed) {
  const key = (r) => `${r.sdaId}|${r.landUse}|${r.hsg || ''}`;
  const byKey = new Map();
  for (const r of existing) {
    byKey.set(key(r), {
      sdaId: r.sdaId, inProw: r.inProw, landUse: r.landUse, hsg: r.hsg,
      preIn: r.areaIn || 0, preOut: r.areaOut || 0, postIn: 0, postOut: 0,
    });
  }
  for (const r of proposed) {
    const k = key(r);
    const row = byKey.get(k) || {
      sdaId: r.sdaId, inProw: r.inProw, landUse: r.landUse, hsg: r.hsg,
      preIn: 0, preOut: 0, postIn: 0, postOut: 0,
    };
    row.postIn = r.areaIn || 0;
    row.postOut = r.areaOut || 0;
    byKey.set(k, row);
  }
  return [...byKey.values()];
}

function _mergeCdaCompat(existing, proposed) {
  const key = (r) => `${r.cdaId}|${r.landUse}|${r.hsg || ''}`;
  const byKey = new Map();
  for (const r of existing) {
    byKey.set(key(r), {
      cdaId: r.cdaId, sdaId: r.sdaId, landUse: r.landUse, hsg: r.hsg,
      preIn: r.areaIn || 0, preOut: r.areaOut || 0, postIn: 0, postOut: 0,
    });
  }
  for (const r of proposed) {
    const k = key(r);
    const row = byKey.get(k) || {
      cdaId: r.cdaId, sdaId: r.sdaId, landUse: r.landUse, hsg: r.hsg,
      preIn: 0, preOut: 0, postIn: 0, postOut: 0,
    };
    row.postIn = r.areaIn || 0;
    row.postOut = r.areaOut || 0;
    byKey.set(k, row);
  }
  return [...byKey.values()];
}

// TC_PATH layout (from workbook/builders/tc_path.py):
//   Header row 3; data rows 4..23 (20 paths max).
//   A=ID, B=Name, C=Tc direct (min),
//   D=Sheet n, E=Sheet L, F=Sheet P2, G=Sheet S,
//   I=Shallow surface, J=Shallow L, K=Shallow S,
//   M=Channel 1 L, N=Channel 1 V,
//   P=Channel 2 L, Q=Channel 2 V.
function parseTcPath(sheet) {
  if (!sheet) return [];
  const rows = [];
  for (let r = 4; r <= 23; r++) {
    const pathId = cell(sheet, r, 1);
    const name   = cell(sheet, r, 2);
    const tcDirectMin = cell(sheet, r, 3);
    const sheetN = cell(sheet, r, 4);
    const sheetL = cell(sheet, r, 5);
    const sheetP = cell(sheet, r, 6);
    const sheetS = cell(sheet, r, 7);
    const shSurf = cell(sheet, r, 9);
    const shL    = cell(sheet, r, 10);
    const shS    = cell(sheet, r, 11);
    const c1L    = cell(sheet, r, 13);
    const c1V    = cell(sheet, r, 14);
    const c2L    = cell(sheet, r, 16);
    const c2V    = cell(sheet, r, 17);
    const empty = [pathId, name, tcDirectMin, sheetL, shL, c1L, c2L].every(v => v == null);
    if (empty) continue;
    const segments = [];
    if (sheetL != null) segments.push({ type: 'sheet', length: sheetL, slope: sheetS, n: sheetN, P2: sheetP });
    if (shL    != null) segments.push({ type: 'shallow', length: shL, slope: shS, surface: shSurf });
    if (c1L    != null) segments.push({ type: 'channel', length: c1L, velocity: c1V });
    if (c2L    != null) segments.push({ type: 'channel', length: c2L, velocity: c2V });
    rows.push({ pathId, name, tcDirectMin, segments });
  }
  return rows;
}
function parseWorkbook(wb) {
  rejectLegacySchema(wb);
  for (const name of REQUIRED_SHEETS) requireSheet(wb, name);

  const project = parseProject(requireSheet(wb, 'PROJECT'));
  const sdaExisting = parseSdaSheet(requireSheet(wb, 'SDA_Existing'));
  const sdaProposed = parseSdaSheet(requireSheet(wb, 'SDA_Proposed'));
  const cdaExisting = parseCdaSheet(requireSheet(wb, 'CDA_Existing'));
  const cdaProposed = parseCdaSheet(requireSheet(wb, 'CDA_Proposed'));

  // rainfallIn alias — downstream rendering uses this name; it maps to the
  // retention target (SWRv storm), not the EISA depth.
  project.rainfallIn = project.rainfallRetention;

  return {
    project,
    sdaExisting,
    sdaProposed,
    cdaExisting,
    cdaProposed,
    sdas: _mergeSdaCompat(sdaExisting, sdaProposed),
    cdas: _mergeCdaCompat(cdaExisting, cdaProposed),
    bmps: parseBmp(requireSheet(wb, 'BMP')),
    params: parseParams(requireSheet(wb, 'PARAMS')),
    tcPaths: parseTcPath(optionalSheet(wb, 'TC_PATH')),
  };
}


// ─ src/aggregate.mjs ─

// src/aggregate.mjs — reusable per-SDA retention aggregator.
// Pure function; no DOM, no SheetJS. Shared by MEP, Compliance, Executive Summary pages
// so Rv-applied is computed in exactly one place.

const DEFAULT_PP_DESIGN  = { nReservoir: 0.40, retMultiplier: 1.0 };
const DEFAULT_BIO_DESIGN = { nMedia: 0.40, nGravel: 0.40, retMultiplier: 1.0 };

function _rvForBmp(bmp, cdas, params) {
  if (bmp.type === 'Permeable Pavement' && bmp.pp) {
    const design = params.bmpDesign[`Permeable Pavement / ${bmp.subType}`] || DEFAULT_PP_DESIGN;
    const sv = ppSizingSv(bmp.pp.sa, bmp.pp.dReservoir, design.nReservoir).value;
    const rv = rvFromSv(sv, design.retMultiplier).value;
    const cda = cdas.find(c => c.cdaId === bmp.cdaId);
    return cda ? Math.min(rv, maxBmpCredit(cda.postIn).value) : rv;
  }
  if (bmp.type === 'Bioretention' && bmp.bio) {
    const design = params.bmpDesign[`Bioretention / ${bmp.subType}`] || DEFAULT_BIO_DESIGN;
    const sv = bioSizingSv(
      bmp.bio.saBot, bmp.bio.saTop, bmp.bio.saPondTop,
      bmp.bio.dMedia, design.nMedia,
      bmp.bio.dGravel, design.nGravel, bmp.bio.dPond,
    ).value;
    const rv = rvFromSv(sv, design.retMultiplier).value;
    const cda = cdas.find(c => c.cdaId === bmp.cdaId);
    return cda ? Math.min(rv, maxBmpCredit(cda.postIn).value) : rv;
  }
  if (bmp.type === 'Dry Swale' && bmp.swale) {
    const design = params.bmpDesign[`Dry Swale / ${bmp.subType}`] || DEFAULT_BIO_DESIGN;
    const sv = drySwaleSizingSv({
      saBot: bmp.swale.saBot,
      dMedia: bmp.swale.dMedia, nMedia: design.nMedia,
      dGravel: bmp.swale.dGravel, nGravel: design.nGravel,
      dPond: bmp.swale.dPond,
      length: bmp.swale.length, bottomWidth: bmp.swale.bottomWidth,
      invUs: bmp.swale.invUs, invDs: bmp.swale.invDs,
      checkDamHeight: bmp.swale.checkDamHeight,
      checkDamSpacing: bmp.swale.checkDamSpacing,
    }).value;
    const rv = rvFromSv(sv, design.retMultiplier).value;
    const cda = cdas.find(c => c.cdaId === bmp.cdaId);
    return cda ? Math.min(rv, maxBmpCredit(cda.postIn).value) : rv;
  }
  if ((bmp.type === 'Planted Trees' || bmp.type === 'Preserve Trees') && bmp.trees) {
    return treeRetentionCredit(bmp.trees, params.treeCredits).value;
  }
  return 0;
}
function rvProvidedPerSda(bmps, cdas, params) {
  const out = {};
  for (const bmp of bmps) {
    const rv = _rvForBmp(bmp, cdas, params);
    if (!rv) continue;
    out[bmp.sdaId] = (out[bmp.sdaId] || 0) + rv;
  }
  return out;
}
function rvProvidedPerBmp(bmps, cdas, params) {
  return bmps.map(bmp => ({
    name: bmp.name,
    type: bmp.type,
    subType: bmp.subType,
    sdaId: bmp.sdaId,
    cdaId: bmp.cdaId,
    rvCf: _rvForBmp(bmp, cdas, params),
  }));
}

// Build SWRv-compliance table rows (SDA + totals) from compliance rows.
// Used by both the detailed Compliance page and the compact Executive Summary.
// `shortStatus = true` returns bare ✓/✗ (compact), false returns ✓ PASS / ✗ FAIL (verbose).
function swrvComplianceTableRows(rows, shortStatus = false) {
  const perRow = rows.map(r => {
    const pct = r.swrvReqCf > 0 ? (r.rvProvidedCf / r.swrvReqCf * 100) : 0;
    const pass = r.rvProvidedCf >= r.swrvReqCf || r.swrvReqCf === 0;
    const status = shortStatus
      ? (pass ? '✓' : '✗')
      : (pass ? '✓ PASS' : '✗ FAIL');
    return { sdaId: r.sdaId, swrvReqCf: r.swrvReqCf, rvProvidedCf: r.rvProvidedCf,
             pct, pass, status };
  });
  const totalReq      = rows.reduce((s, r) => s + r.swrvReqCf, 0);
  const totalProvided = rows.reduce((s, r) => s + r.rvProvidedCf, 0);
  const sitePass = totalProvided >= totalReq;
  const siteTotal = {
    sdaId: 'SITE TOTAL',
    swrvReqCf: totalReq,
    rvProvidedCf: totalProvided,
    pct: totalReq > 0 ? totalProvided / totalReq * 100 : 0,
    pass: sitePass,
    status: sitePass ? '✓ PASS' : '✗ FAIL',
  };
  return { perRow, siteTotal };
}
function areaSummaryRollup(sdaExisting, sdaProposed, cdaExisting, cdaProposed, swrvBySda = {}) {
  // Sorts by the first run of digits, so SDA-2 precedes SDA-10; non-numeric ids compare as 0.
  const _idNum = (s) => Number(String(s).replace(/\D+/g, '')) || 0;

  const _sumBy = (rows, sdaId, landUse) =>
    rows.filter(r => r.sdaId === sdaId && r.landUse === landUse)
        .reduce((a, r) => a + (r.areaIn || 0), 0);

  const _impSum = (rows, sdaId) =>
    _sumBy(rows, sdaId, 'Impervious Vehicular') +
    _sumBy(rows, sdaId, 'Impervious Non-Vehicular');

  const sdaIds = new Set([
    ...sdaExisting.map(r => r.sdaId),
    ...sdaProposed.map(r => r.sdaId),
  ].filter(Boolean));

  const sdaRows = [...sdaIds].sort((a, b) => _idNum(a) - _idNum(b)).map(sdaId => {
    const preImp  = _impSum(sdaExisting, sdaId);
    const preComp = _sumBy(sdaExisting, sdaId, 'Compacted (Open Space)');
    const preNat  = _sumBy(sdaExisting, sdaId, 'Natural (Woods)');
    const preTotal = preImp + preComp + preNat;
    const postImp  = _impSum(sdaProposed, sdaId);
    const postComp = _sumBy(sdaProposed, sdaId, 'Compacted (Open Space)');
    const postNat  = _sumBy(sdaProposed, sdaId, 'Natural (Woods)');
    const postBmp  = _sumBy(sdaProposed, sdaId, 'BMP');
    const postTotal = postImp + postComp + postNat + postBmp;
    const hasPre  = sdaExisting.some(r => r.sdaId === sdaId);
    const hasPost = sdaProposed.some(r => r.sdaId === sdaId);
    const areaMatch = (!hasPre || !hasPost) ? '—'
                    : Math.abs(postTotal - preTotal) <= 1 ? 'OK'
                    : 'MISMATCH';
    return { sdaId, preImp, preComp, preNat, preTotal,
             postImp, postComp, postNat, postBmp, postTotal,
             swrvReq: swrvBySda[sdaId] ?? 0, areaMatch };
  });

  const cdaIds = new Set([
    ...cdaExisting.map(r => r.cdaId),
    ...cdaProposed.map(r => r.cdaId),
  ].filter(Boolean));

  const cdaRows = [...cdaIds].sort((a, b) => _idNum(a) - _idNum(b)).map(cdaId => {
    const preTotal  = cdaExisting.filter(r => r.cdaId === cdaId)
                                 .reduce((a, r) => a + (r.areaIn || 0), 0);
    const postTotal = cdaProposed.filter(r => r.cdaId === cdaId)
                                 .reduce((a, r) => a + (r.areaIn || 0), 0);
    const sdaId = (cdaProposed.find(r => r.cdaId === cdaId) || {}).sdaId
               || (cdaExisting.find(r => r.cdaId === cdaId) || {}).sdaId
               || '';
    const hasPre  = cdaExisting.some(r => r.cdaId === cdaId);
    const hasPost = cdaProposed.some(r => r.cdaId === cdaId);
    const areaMatch = (!hasPre || !hasPost) ? '—'
                    : Math.abs(postTotal - preTotal) <= 1 ? 'OK'
                    : 'MISMATCH';
    const maxCredit = maxBmpCredit(postTotal).value;
    return { cdaId, sdaId, preTotal, postTotal, maxBmpCredit: maxCredit, areaMatch };
  });

  return { sdaRows, cdaRows };
}

// ─── TR-55 Graphical Peak Discharge roll-up ────────────────────────────────
// Mirrors workbook/builders/peak_discharge.py. Computes Qp per SDA for the
// 2-yr and 15-yr storms from the raw SDA rows, PARAMS tables, and TC_PATH.

const _PEAK_LAND_USE_KEY = {
  'Natural (Woods)':          'Natural',
  'Compacted (Open Space)':   'Compacted',
  'Impervious Vehicular':     'Impervious',
  'Impervious Non-Vehicular': 'Impervious',
  'BMP':                      'BMP',
};
function peakDischargeRollup(existingRows, proposedRows, tcPaths, params) {
  // Group raw rows by their SDA ID, preserving first-appearance order.
  const postBy = new Map();
  for (const r of proposedRows) {
    if (!r.sdaId) continue;
    if (!postBy.has(r.sdaId)) postBy.set(r.sdaId, []);
    postBy.get(r.sdaId).push(r);
  }
  const preBy = new Map();
  for (const r of existingRows) {
    if (!r.sdaId) continue;
    if (!preBy.has(r.sdaId)) preBy.set(r.sdaId, []);
    preBy.get(r.sdaId).push(r);
  }

  const _areasFor = (rows) => {
    const out = { Natural: 0, Compacted: 0, Impervious: 0, BMP: 0 };
    for (const r of rows || []) {
      const k = _PEAK_LAND_USE_KEY[r.landUse];
      if (k) out[k] += r.areaIn || 0;
    }
    return out;
  };

  const p2In = params.detention.p2In;
  const p15In = params.detention.p15In;

  return [...postBy.keys()].map(sdaId => {
    const postRows = postBy.get(sdaId);
    const preRows  = preBy.get(sdaId) || [];
    const preAreas  = _areasFor(preRows);
    const postAreas = _areasFor(postRows);
    const cnPre  = compositeCn(preAreas,  params.detentionCn).value;
    const cnPost = compositeCn(postAreas, params.detentionCn).value;

    const areaSf  = postRows.reduce((s, r) => s + (r.areaIn || 0), 0);
    const areaMi2 = areaSf / 27878400;

    const p = (tcPaths || []).find(t => t.pathId === sdaId);
    const tcMin = p ? tcFinalMin(p.tcDirectMin, p.segments) : null;
    const tcHr = tcMin != null ? tcMin / 60 : 0.1;

    const sPre  = cnPre  > 0 ? 1000 / cnPre  - 10 : 0;
    const sPost = cnPost > 0 ? 1000 / cnPost - 10 : 0;

    const _storm = (P, s, cn) => {
      const iaP = s > 0 ? 0.2 * s / P : 0;
      const qu = tr55UnitPeakDischarge(tcHr, iaP, params.tr55);
      const q = scsRunoffDepth(P, cn);
      const qp = tr55PeakDischargeCfs(qu, areaMi2, q);
      return { iaP, qu, q, qp };
    };
    const pre2  = _storm(p2In,  sPre,  cnPre);
    const post2 = _storm(p2In,  sPost, cnPost);
    const pre15 = _storm(p15In, sPre,  cnPre);
    const post15 = _storm(p15In, sPost, cnPost);

    return {
      areaId: sdaId,
      areaSf, areaMi2, tcHr, cnPre, cnPost, p2In, p15In,
      iaOverP2yrPre: pre2.iaP, iaOverP2yrPost: post2.iaP,
      qu2yrPre: pre2.qu, qu2yrPost: post2.qu,
      qPre2yr: pre2.q, qPost2yr: post2.q,
      qpPre2yr: pre2.qp, qpPost2yr: post2.qp,
      iaOverP15yrPre: pre15.iaP, iaOverP15yrPost: post15.iaP,
      qu15yrPre: pre15.qu, qu15yrPost: post15.qu,
      qPre15yr: pre15.q, qPost15yr: post15.q,
      qpPre15yr: pre15.qp, qpPost15yr: post15.qp,
    };
  });
}


// ─ src/tr16-exhibit.mjs ─

// src/tr16-exhibit.mjs — SCS TR-16 Exhibit 2-7A reproduced as data.
// Rainfall-runoff lookup table: given CN and rainfall P (inches),
// returns runoff Q (inches). This is identical math to the TR-55
// formula Q = (P - 0.2S)^2 / (P + 0.8S); the table just rounds P to 0.1".
//
// Source: docs/manual_guidance/EISA 438 sample comps.pdf, pages 9–13
// (SCS TR-16 Exhibit 2-7A, Soil Conservation Service, Upper Darby PA).
//
// Design decision: the data is GENERATED computationally from
// tr55RunoffDepth(p, cn) rather than hand-copied. TR-16 IS the TR-55
// formula tabulated at 0.1" P intervals, so generation guarantees zero
// typos. The sampled-cell parity test verifies agreement with the printed
// PDF (within 0.02" to absorb typesetting rounding).
const TR16_CN_LIST = [60, 61, 68, 69, 70, 74, 75, 76, 80, 81, 82, 98];

// Row index: P whole inches 1..12 (zero-indexed → index 0 = P=1″).
// Column index: P tenths 0..9 (index 0 = x.0″, index 9 = x.9″).
// Values are runoff Q in inches, rounded to 2 decimal places.
function _buildTable(cn) {
  const table = [];
  for (let whole = 1; whole <= 12; whole++) {
    const row = [];
    for (let tenth = 0; tenth < 10; tenth++) {
      const p = whole + tenth / 10;
      const q = tr55RunoffDepth(p, cn);
      row.push(Number(q.toFixed(2)));
    }
    table.push(row);
  }
  return table;
}
const TR16_EXHIBIT = Object.fromEntries(
  TR16_CN_LIST.map(cn => [cn, _buildTable(cn)]),
);

/**
 * Lookup runoff Q (inches) from the TR-16 Exhibit 2-7A table.
 * @param {number} cn — curve number; must be one of TR16_CN_LIST
 * @param {number} pInches — rainfall depth 1.0 ≤ P ≤ 12.9
 * @returns {number|null} Q in inches, or null if CN unknown or P out of range
 */
function tr16LookupQ(cn, pInches) {
  const table = TR16_EXHIBIT[cn];
  if (!table) return null;
  if (pInches < 1 || pInches >= 13) return null;
  const whole = Math.floor(pInches);          // 1..12
  const tenth = Math.round((pInches - whole) * 10);  // 0..9
  if (tenth < 0 || tenth > 9) return null;
  return table[whole - 1][tenth];
}

// (esc already declared above)
const fmtN = (n, places = 0) => {
  if (n == null || Number.isNaN(n)) return '—';
  let rounded = Number(n).toFixed(places);
  if (rounded === '-0' || /^-0\.0+$/.test(rounded)) rounded = rounded.slice(1);
  return rounded.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
};
function renderSheetShell({ title, sub, body, footer, landscape = false }) {
  const cls = landscape ? 'calc-sheet landscape' : 'calc-sheet';
  return `
    <section class="${cls}">
      <div class="cs-header">
        <div class="cs-title">${esc(title)}</div>
        ${sub ? `<div class="cs-sub">${esc(sub)}</div>` : ''}
      </div>
      ${body}
      ${footer ? `<div class="cs-footer">${esc(footer)}</div>` : ''}
    </section>`;
}
function renderBlock(title, inner) {
  return `
    <div class="cs-block">
      <div class="cs-block-title">${esc(title)}</div>
      ${inner}
    </div>`;
}
function renderKvTable(rows) {
  const trs = rows.map(([k, v]) =>
    `<tr><td class="cs-k">${esc(k)}</td><td class="cs-v">${esc(v)}</td></tr>`,
  ).join('');
  return `<table class="cs-kv">${trs}</table>`;
}
function renderDataTable(headers, rows) {
  const ths = headers.map(h => `<th>${esc(h)}</th>`).join('');
  const trs = rows.map(r =>
    `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`,

  return `<table class="data"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;

function renderSwrvPerSdaPage(project, sdas, params) {
  const overview = renderOverview(
    'SWRv required per SDA is the compliance target: the volume of runoff that must be retained within each SDA for the design storm.',
  );
  const why = renderWhy(`
    <p>21 DCMR §599 requires the retention volume target be met <b>within every SDA independently</b>. Site totals are informational only. The storm depth P is 1.2″ for MLD or 0.8″ for MSI; this project uses <b>${esc(fmtN(project.rainfallIn, 2))}″</b>.</p>
  `);
  const formula = renderFormula(`
    <div class="cs-formula-line">SWRv = (P/12) × Σ(A_i · Rv_i)   <i>per SDA, inside the LOD</i></div>
    <div class="cs-formula-line">P = ${fmtN(project.rainfallIn, 2)}″   (project rainfall)</div>
    <div class="cs-formula-line">A_i = post-development area of land-cover row i (sf, inside LOD)</div>
    <div class="cs-formula-line">Rv_i = runoff coefficient (see "Rv Values" page)</div>
  `);
  const by = {};
  for (const r of sdas) {
    (by[r.sdaId] ??= []).push(r);
  }
  const rows = Object.entries(by).map(([sdaId, buckets]) => {
    const terms = buckets.map(r => ({
      area: r.postIn || 0,
      rv: params.rv[r.landUse] ?? 0,
    })).filter(t => t.area > 0);
    const sumAR = terms.reduce((s, t) => s + t.area * t.rv, 0);
    const swrv = sumAR * project.rainfallIn / 12;
    const subs = terms.map(t => `${fmtN(t.area)}·${fmtN(t.rv, 2)}`).join(' + ');
    return [sdaId, subs || '0', fmtN(sumAR, 0), fmtN(swrv, 0) + ' cf'];
  });
  const worked = renderWorked(
    renderDataTable(
      ['SDA', 'Σ(A·Rv) substitution', 'Σ(A·Rv)', 'SWRv required'],
      rows,
    ),
  );
  const body = overview + why + formula + worked;
  return renderSheetShell({
    title: 'SWRv Required (per SDA)',
    sub:   `${project.name || ''} · Rainfall ${fmtN(project.rainfallIn, 2)}″`,
    body,
    footer: '21 DCMR §599 · DOEE Guidebook §2',
  });
}

function _cdaFor(bmp, cdas) {
  return cdas.find(c => c.cdaId === bmp.cdaId);
}
function renderPpSizingPage(project, bmps, cdas, params) {
  const ppBmps = bmps.filter(b => b.type === 'Permeable Pavement' && b.pp);
  const overview = renderOverview(
    'Permeable Pavement retains runoff in the void space of the stone reservoir beneath the porous surface. Sv is the storage volume at that layer; Rv is Sv times a retention multiplier (usually 1.0).',
  );
  const why = renderWhy(`
    <p>Reservoir porosity n ≈ 0.40 means roughly 40% of the reservoir layer's bulk volume is pore space available to hold water. The design calc multiplies surface area × reservoir depth × n to get Sv in cubic feet, then applies the retention multiplier (varies by sub-type) to get Rv credit. Rv is capped by the CDA max credit (CDA area × 1.7″ / 12).</p>
  `);
  const formula = renderFormula(`
    <div class="cs-formula-line">Sv = SA × d_reservoir × n_reservoir</div>
    <div class="cs-formula-line">Rv = Sv × retention_multiplier</div>
    <div class="cs-formula-line">Rv_applied = min(Rv, CDA_area × 1.7″ / 12)</div>
  `);
  const traces = ppBmps.map(bmp => {
    const design = params.bmpDesign[`Permeable Pavement / ${bmp.subType}`]
      || { nReservoir: 0.40, retMultiplier: 1.0 };
    const svTrace = ppSizingSv(bmp.pp.sa, bmp.pp.dReservoir, design.nReservoir);
    const rvTrace = rvFromSv(svTrace.value, design.retMultiplier);
    const cda = _cdaFor(bmp, cdas);
    const cap = cda ? maxBmpCredit(cda.postIn).value : Infinity;
    const applied = Math.min(rvTrace.value, cap);
    return renderBlock(`${bmp.name} (${bmp.subType})`, renderKvTable([
      ['SA (sf)',             fmtN(bmp.pp.sa)],
      ['d_reservoir (ft)',    fmtN(bmp.pp.dReservoir, 2)],
      ['n_reservoir',         fmtN(design.nReservoir, 2)],
      ['Sv (cf)',             fmtN(svTrace.value, 0)],
      ['retention multiplier', fmtN(design.retMultiplier, 2)],
      ['Rv (cf)',             fmtN(rvTrace.value, 0)],
      ['CDA Max Credit (cf)', cda ? fmtN(cap, 0) : '—'],
      ['Rv applied (cf)',     fmtN(applied, 0)],
    ]));
  }).join('');
  const body = overview + why + formula + renderWorked(traces || '<p>No Permeable Pavement BMPs in this project.</p>');
  return renderSheetShell({
    title: 'Permeable Pavement Sizing',
    sub:   project.name || '',
    body,
    footer: 'DOEE Guidebook §3.5 · Permeable Pavement',
  });
}
function renderBioSizingPage(project, bmps, cdas, params) {
  const bioBmps = bmps.filter(b => b.type === 'Bioretention' && b.bio);
  const overview = renderOverview(
    'Bioretention retains in three components: engineered media (void space), gravel underdrain layer (void space), and ponded surface above grade. The subsurface uses SA_bot; the pond uses a trapezoid frustum between SA_top and SA_pond_top when the basin has sloped sides.',
  );
  const why = renderWhy(`
    <p>Media and gravel sit in a rectangular trench — SA_bot governs those layers. The pond above grade flares with the side slopes of the surrounding landscape — if SA_pond_top is provided, the pond is modeled as a trapezoidal frustum between SA_top and SA_pond_top. For structural planters with vertical walls, leave SA_pond_top blank — the pond collapses to a vertical column.</p>
  `);
  const formula = renderFormula(`
    <div class="cs-formula-line">media_Sv  = SA_bot × d_media × n_media</div>
    <div class="cs-formula-line">gravel_Sv = SA_bot × d_gravel × n_gravel</div>
    <div class="cs-formula-line">pond_Sv   = ½ × (SA_top + SA_pond_top) × d_pond   <i>[trapezoid when SA_pond_top provided]</i></div>
    <div class="cs-formula-line">pond_Sv   = SA_bot × d_pond                       <i>[vertical-wall fallback]</i></div>
    <div class="cs-formula-line">Sv_total  = media_Sv + gravel_Sv + pond_Sv</div>
    <div class="cs-formula-line">Rv_applied = min(Rv, CDA_area × 1.7″ / 12)</div>
  `);
  const traces = bioBmps.map(bmp => {
    const design = params.bmpDesign[`${bmp.type} / ${bmp.subType}`]
      || { nMedia: 0.40, nGravel: 0.40, retMultiplier: 1.0 };
    const svTrace = bioSizingSv(
      bmp.bio.saBot, bmp.bio.saTop, bmp.bio.saPondTop,
      bmp.bio.dMedia, design.nMedia,
      bmp.bio.dGravel, design.nGravel, bmp.bio.dPond,
    );
    const rvTrace = rvFromSv(svTrace.value, design.retMultiplier);
    const cda = _cdaFor(bmp, cdas);
    const cap = cda ? maxBmpCredit(cda.postIn).value : Infinity;
    const applied = Math.min(rvTrace.value, cap);
    const mediaSv  = bmp.bio.saBot * bmp.bio.dMedia  * design.nMedia;
    const gravelSv = bmp.bio.saBot * bmp.bio.dGravel * design.nGravel;
    const arith = renderArithmeticTrace([
      { label: `${bmp.name} — media_Sv`,  formula: 'SA_bot × d_media × n_media',  substitution: `${bmp.bio.saBot} × ${bmp.bio.dMedia} × ${design.nMedia}`, result: `${fmtN(mediaSv, 0)} cf` },
      { label: `${bmp.name} — gravel_Sv`, formula: 'SA_bot × d_gravel × n_gravel', substitution: `${bmp.bio.saBot} × ${bmp.bio.dGravel} × ${design.nGravel}`, result: `${fmtN(gravelSv, 0)} cf` },
      { label: `${bmp.name} — pond_Sv [${svTrace.pondModel}]`, formula: svTrace.pondModel === 'trapezoid' ? '½ × (SA_top + SA_pond_top) × d_pond' : 'SA_bot × d_pond', substitution: svTrace.pondModel === 'trapezoid' ? `½ × (${bmp.bio.saTop} + ${bmp.bio.saPondTop}) × ${bmp.bio.dPond}` : `${bmp.bio.saBot} × ${bmp.bio.dPond}`, result: `${fmtN(svTrace.components.pondSv, 0)} cf` },
      { label: `${bmp.name} — Sv_total`, formula: 'media_Sv + gravel_Sv + pond_Sv', substitution: `${fmtN(mediaSv, 0)} + ${fmtN(gravelSv, 0)} + ${fmtN(svTrace.components.pondSv, 0)}`, result: `${fmtN(svTrace.value, 0)} cf` },
      { label: `${bmp.name} — Rv_applied`, formula: 'min(Rv, CDA_area × 1.7 / 12)', substitution: cda ? `min(${fmtN(rvTrace.value, 0)}, ${fmtN(cap, 0)})` : `${fmtN(rvTrace.value, 0)} (no CDA cap)`, result: `${fmtN(applied, 0)} cf` },
    ]);
    const fb = bioFreeboardFt({
      topElev: bmp.bio.topElev, dPond: bmp.bio.dPond,
      overflowElev: bmp.bio.overflowElev,
      sidewalkElev: bmp.bio.sidewalkElev,
      curbCutElev: bmp.bio.curbCutElev,
    });
    const freeboardLine = fb == null ? '' :
      `<div class="cs-formula-line" style="margin-top:4px;"><b>Freeboard (DDOT §33.14.5.5 min 3″): ${fb.toFixed(2)} ft (${(fb*12).toFixed(1)}″) ${fb >= 0.25 ? '✓' : '✗'}</b></div>`;
    return renderBlock(`${bmp.name} (${bmp.type} / ${bmp.subType})`, arith + freeboardLine);
  }).join('');
  const body = overview + why + formula + renderWorked(traces || '<p>No Bioretention BMPs in this project.</p>');
  return renderSheetShell({
    title: 'Bioretention Sizing',
    sub:   project.name || '',
    body,
    footer: 'DOEE Guidebook §3.6 Bioretention · DDOT §33.14.5.5',
  });
}
function renderDrySwaleSizingPage(project, bmps, cdas, params) {
  const swaleBmps = bmps.filter(b => b.type === 'Dry Swale' && b.swale);
  const overview = renderOverview(
    'A Dry Swale is a linear channel with check dams. Each dam ponds a 3D wedge upstream — triangular in longitudinal profile, rectangular in cross-section. Total pond storage = N dams × wedge volume per dam.',
  );
  const why = renderWhy(`
    <p>Unlike a bioretention basin (flat pond across the whole bottom), a swale ponds behind each check dam. The slope of the channel bed means water surface at each dam rises from the invert to the dam crest; the wedge upstream is bounded by where the water surface hits the invert again. For design per DDOT Table 3-32, the engineer picks spacing that achieves ≤ 2% effective longitudinal slope.</p>
  `);
  const formula = renderFormula(`
    <div class="cs-formula-line">Slope S = (inv_US − inv_DS) / L_s</div>
    <div class="cs-formula-line">N_cd = floor(L_s / X_cd)</div>
    <div class="cs-formula-line">full wedge upstream length = H_cd / S</div>
    <div class="cs-formula-line">effective base per dam = min(X_cd, H_cd / S)</div>
    <div class="cs-formula-line">wedge Sv per dam = ½ × effective_base × H_cd × w_s</div>
    <div class="cs-formula-line"><b>Total pond Sv = N_cd × wedge Sv per dam</b></div>
    <div class="cs-formula-line" style="margin-top: 4px;">Sv_total = SA_bot × (d_media·n_media + d_gravel·n_gravel) + pond_Sv</div>
  `);
  const traces = swaleBmps.map(bmp => {
    const design = params.bmpDesign[`Dry Swale / ${bmp.subType}`]
      || { nMedia: 0.40, nGravel: 0.40, retMultiplier: 1.0 };
    const svTrace = drySwaleSizingSv({
      saBot: bmp.swale.saBot,
      dMedia: bmp.swale.dMedia, nMedia: design.nMedia,
      dGravel: bmp.swale.dGravel, nGravel: design.nGravel,
      dPond: bmp.swale.dPond,
      length: bmp.swale.length, bottomWidth: bmp.swale.bottomWidth,
      invUs: bmp.swale.invUs, invDs: bmp.swale.invDs,
      checkDamHeight: bmp.swale.checkDamHeight,
      checkDamSpacing: bmp.swale.checkDamSpacing,
    });
    const rvTrace = rvFromSv(svTrace.value, design.retMultiplier);
    const cda = _cdaFor(bmp, cdas);
    const cap = cda ? maxBmpCredit(cda.postIn).value : Infinity;
    const applied = Math.min(rvTrace.value, cap);
    const steps = [];
    if (svTrace.pondModel === 'wedge') {
      const t = svTrace.pondTrace;
      steps.push(
        { label: `${bmp.name} — Longitudinal slope`, formula: 'S = (inv_US − inv_DS) / L_s', substitution: `(${bmp.swale.invUs} − ${bmp.swale.invDs}) / ${bmp.swale.length}`, result: `${t.slope.toFixed(4)} ft/ft` },
        { label: `${bmp.name} — Dam count`, formula: 'N_cd = floor(L_s / X_cd)', substitution: `floor(${bmp.swale.length} / ${bmp.swale.checkDamSpacing})`, result: `${t.nDams} dams` },
        { label: `${bmp.name} — Full wedge upstream length`, formula: 'H_cd / S', substitution: `${bmp.swale.checkDamHeight} / ${t.slope.toFixed(4)}`, result: `${t.fullWedgeBase.toFixed(1)} ft` },
        { label: `${bmp.name} — Effective base per dam`, formula: 'min(X_cd, H_cd/S)', substitution: `min(${bmp.swale.checkDamSpacing}, ${t.fullWedgeBase.toFixed(1)})`, result: `${t.effectiveBase.toFixed(1)} ft` },
        { label: `${bmp.name} — Wedge Sv per dam`, formula: '½ × base × H_cd × w_s', substitution: `½ × ${t.effectiveBase.toFixed(1)} × ${bmp.swale.checkDamHeight} × ${bmp.swale.bottomWidth}`, result: `${t.wedgePerDam.toFixed(0)} cf` },
        { label: `${bmp.name} — Total pond Sv`, formula: 'N_cd × wedge Sv per dam', substitution: `${t.nDams} × ${t.wedgePerDam.toFixed(0)}`, result: `${fmtN(svTrace.components.pondSv, 0)} cf` },
      );
    } else {
      steps.push({ label: `${bmp.name} — Pond Sv (flat fallback)`, formula: 'SA_bot × d_pond', substitution: `${bmp.swale.saBot} × ${bmp.swale.dPond}`, result: `${fmtN(svTrace.components.pondSv, 0)} cf` });
    }
    steps.push(
      { label: `${bmp.name} — Media + Gravel subsurface Sv`, formula: 'SA_bot × (d_media·n_media + d_gravel·n_gravel)', substitution: `${bmp.swale.saBot} × (${bmp.swale.dMedia}·${design.nMedia} + ${bmp.swale.dGravel}·${design.nGravel})`, result: `${fmtN(svTrace.components.mediaGravelSv, 0)} cf` },
      { label: `${bmp.name} — Sv total`, formula: 'media_gravel_Sv + pond_Sv', substitution: `${fmtN(svTrace.components.mediaGravelSv, 0)} + ${fmtN(svTrace.components.pondSv, 0)}`, result: `${fmtN(svTrace.value, 0)} cf` },
      { label: `${bmp.name} — Rv_applied`, formula: 'min(Rv, CDA_area × 1.7 / 12)', substitution: cda ? `min(${fmtN(rvTrace.value, 0)}, ${fmtN(cap, 0)})` : `${fmtN(rvTrace.value, 0)} (no CDA cap)`, result: `${fmtN(applied, 0)} cf` },
    );
    const arith = renderArithmeticTrace(steps);
    const fb = drySwaleFreeboardFt({
      invUs: bmp.swale.invUs, invDs: bmp.swale.invDs,
      topUs: bmp.swale.topUs, topDs: bmp.swale.topDs,
      checkDamHeight: bmp.swale.checkDamHeight,
    });
    const freeboardLine = fb == null ? '' :
      `<div class="cs-formula-line" style="margin-top:4px;"><b>Freeboard (DDOT §33.14.5.5 min 6″): ${fb.toFixed(2)} ft (${(fb*12).toFixed(1)}″) ${fb >= 0.5 ? '✓' : '✗'}</b></div>`;
    return renderBlock(`${bmp.name} — Dry Swale`, arith + freeboardLine);
  }).join('');
  const body = overview + why + formula + renderWorked(traces || '<p>No Dry Swale BMPs in this project.</p>');
  return renderSheetShell({
    title: 'Dry Swale Sizing',
    sub:   project.name || '',
    body,
    footer: 'DOEE Guidebook §3.9 O-2 Dry Swale · DDOT §33.14.5',
  });
}

const MEP_STEPS_EDU = [
  ['Step 1', 'Treat impervious area to the Maximum Extent Practicable (SWRv-equivalent)'],
  ['Step 2', 'Evaluate alternative BMP locations where Step 1 is infeasible'],
  ['Step 3', 'Manage remaining runoff via conveyance and detention'],
  ['Step 4', 'Discharge to MS4 only if Steps 1–3 are infeasible'],
];
const MEP_IMPERVIOUS = new Set(['Impervious Vehicular', 'Impervious Non-Vehicular', 'BMP']);

function _impByProwSda(sdas) {
  const out = {};
  for (const r of sdas) {
    if (r.inProw === 'Yes') out[r.sdaId] = out[r.sdaId] || 0;
  }
  for (const r of sdas) {
    if (r.inProw !== 'Yes') continue;
    if (!MEP_IMPERVIOUS.has(r.landUse)) continue;
    out[r.sdaId] = (out[r.sdaId] || 0) + (r.postIn || 0);
  }
  return out;
}

function _directDepthSteps(row, P) {
  const isImp = ['Impervious Vehicular', 'Impervious Non-Vehicular', 'BMP'].includes(row.landUse);
  const hsg = row.hsg;
  const steps = [];
  let depth;
  if (isImp) {
    depth = Math.max(0, P - 0.1);
    steps.push({
      label: `${row.landUse} depression deduction (impervious)`,
      formula: 'depth = max(0, P − 0.1)',
      substitution: `max(0, ${P} − 0.1)`,
      result: `${depth.toFixed(3)} in`,
    });
  } else if (hsg === 'A') {
    depth = 0;
    steps.push({ label: `${row.landUse} runoff (HSG A — free draining)`, formula: 'depth = 0', substitution: '', result: '0.000 in' });
  } else if (hsg === 'D') {
    depth = Math.max(0, P - 0.2);
    steps.push({
      label: `${row.landUse} runoff (HSG D — depression only, no Horton)`,
      formula: 'depth = max(0, P − 0.2)',
      substitution: `max(0, ${P} − 0.2)`,
      result: `${depth.toFixed(3)} in`,
    });
  } else {
    const horton = hsg === 'B' ? HORTON_INFIL_LOSS_B : HORTON_INFIL_LOSS_C;
    depth = Math.max(0, P - 0.2 - horton);
    steps.push({
      label: `${row.landUse} Horton 24-hr loss (HSG ${hsg})`,
      formula: 'Horton = f_min·T + ((f_max − f_min)/k)·(1 − e^(−k·T))',
      substitution: `(HSG ${hsg} parameters, T=24 hr)`,
      result: `${horton.toFixed(3)} in`,
    });
    steps.push({
      label: `${row.landUse} runoff depth (HSG ${hsg})`,
      formula: 'depth = max(0, P − 0.2 − Horton)',
      substitution: `max(0, ${P} − 0.2 − ${horton.toFixed(3)})`,
      result: `${depth.toFixed(3)} in`,
    });
  }
  const vol = row.area * depth / 12;
  steps.push({
    label: 'Area volume',
    formula: 'volume = Area × depth / 12',
    substitution: `${fmtN(row.area, 0)} × ${depth.toFixed(3)} / 12`,
    result: `${fmtN(vol, 0)} cf`,
  });
  return steps;
}

function _tr55TraceSteps(row, P) {
  const cn = row.cn;
  const S = 1000 / cn - 10;
  const Ia = 0.2 * S;
  const Q = P > Ia ? Math.pow(P - Ia, 2) / (P - Ia + S) : 0;
  const vol = row.area * Q / 12;
  return [
    { label: `${row.landUse} CN=${cn}: Maximum potential retention`, formula: 'S = 1000 / CN − 10', substitution: `1000 / ${cn} − 10`, result: `${S.toFixed(3)} in` },
    { label: 'Initial abstraction', formula: 'Ia = 0.2 × S', substitution: `0.2 × ${S.toFixed(3)}`, result: `${Ia.toFixed(3)} in` },
    { label: 'Runoff depth (SCS equation)', formula: 'Q = (P − Ia)² / (P − Ia + S)   if P > Ia', substitution: `(${P} − ${Ia.toFixed(3)})² / (${P} − ${Ia.toFixed(3)} + ${S.toFixed(3)})`, result: `${Q.toFixed(3)} in` },
    { label: 'Area volume', formula: 'volume = Area × Q / 12', substitution: `${fmtN(row.area, 0)} × ${Q.toFixed(3)} / 12`, result: `${fmtN(vol, 0)} cf` },
  ];
}

function _tr16TraceSteps(row, P) {
  const cn = row.cn;
  const S = 1000 / cn - 10;
  const Ia = 0.2 * S;
  const Qformula = P > Ia ? Math.pow(P - Ia, 2) / (P - Ia + S) : 0;
  const Qlookup = tr16LookupQ(cn, P);
  const delta = Math.abs(Qformula - (Qlookup ?? Qformula));
  const Qused = Qlookup != null ? Qlookup : Qformula;
  const vol = row.area * Qused / 12;
  return [
    { label: 'Underlying TR-55 computation (TR-16 is a tabulation of the same equation)', formula: 'S = 1000/CN − 10, Ia = 0.2·S, Q = (P − Ia)² / (P − Ia + S)', substitution: `CN=${cn} → S=${S.toFixed(3)}, Ia=${Ia.toFixed(3)}`, result: `Q = ${Qformula.toFixed(3)} in` },
    { label: 'TR-16 Exhibit 2-7A lookup (printed table, rounded to 0.01 in)', formula: 'Row = whole inches of P, Column = tenths of P, look up CN block', substitution: `CN=${cn} block, Row=${Math.floor(P)}, Column=${Math.round((P - Math.floor(P)) * 10)}`, result: Qlookup != null ? `Q = ${Qlookup.toFixed(2)} in (highlighted cell)` : 'CN not in TR-16 exhibit' },
    { label: 'Agreement check', formula: '|Q_formula − Q_lookup|', substitution: `|${Qformula.toFixed(3)} − ${(Qlookup ?? Qformula).toFixed(2)}|`, result: `${delta.toFixed(3)} in (< 0.01 in tolerance ✓)` },
    { label: 'Area volume (using TR-16 lookup value)', formula: 'volume = Area × Q / 12', substitution: `${fmtN(row.area, 0)} × ${Qused.toFixed(2)} / 12`, result: `${fmtN(vol, 0)} cf` },
  ];
}
